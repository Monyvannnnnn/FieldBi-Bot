services:
  # 1. Web Service (api.php - Web Dashboard & Webhook Endpoint)
  - type: web
    name: FieldBi-Bot-Web
    runtime: docker
    plan: free
    region: singapore
    dockerCommand: ./start.sh
    envVars:
      - key: DB_DRIVER
        value: pgsql
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "6543"
      - key: DB_NAME
        value: postgres
      - key: DB_USER
        sync: false
      - key: DB_PASS
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_ADMIN_CHAT_ID
        sync: false

  # 2. Background Worker (support_bot_poller.php - Realtime Telegram Poller)
  - type: worker
    name: FieldBi-Bot-Worker
    runtime: docker
    plan: free
    region: singapore
    dockerCommand: php support_bot_poller.php
    envVars:
      - key: DB_DRIVER
        value: pgsql
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "6543"
      - key: DB_NAME
        value: postgres
      - key: DB_USER
        sync: false
      - key: DB_PASS
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_ADMIN_CHAT_ID
        sync: false
